<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Third Web Page</title>

    <link rel="stylesheet" href="demo.css" />
  </head>

  <body>
    <div id="container">
      <header>My Web Site Brand</header>

      <nav>
        <ul>
          <li><a href="js-demo2.html">Home</a></li>
          <li><a href="js-demo2b.html">About</a></li>
          <li><a href="js-demo2d.html">Gallery</a></li>
          <li><a href="js-demo2c.html">Contact</a></li>
        </ul>
      </nav>

      <main>
        <h1>My Third Heading</h1>

        <p>My Third paragraph.</p>

        <form action="/signup" method="post">
          <fieldset>
            <legend>User personal information</legend>

            <label for="name">Enter your full name</label>
            <input id="name" type="text" name="name" />

            <label for="email">Enter your email</label>
            <input id="email" type="email" name="email" />

            <label for="phone">Enter your phone</label>
            <input id="phone" type="text" name="phone" />

            <label>Select your gender</label>

            <input id="male" type="radio" name="gender" value="male" />
            <label for="male" style="display: inline">Male</label>

            <input id="female" type="radio" name="gender" value="female" />
            <label for="female" style="display: inline">Female</label>

            <label for="contact-method">How should we contact you?</label>

            <select id="contact-method" name="contact-method">
              <option value="email">Email</option>
              <option value="phone">Phone</option>
            </select>

            <label for="reason">
              Tell us the reason of your visit today:
            </label>

            <textarea id="reason" name="reason" rows="5" cols="30"></textarea>

            <input type="submit" value="sign-up" />
          </fieldset>
        </form>
      </main>

      <footer>&copy; Copyright 2020</footer>
    </div>
  </body>
</html>
