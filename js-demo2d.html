<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Fourth Web Page</title>

    <link rel="stylesheet" href="demo.css" />
  </head>

  <body>
    <div id="container">
      <header>My Web Site Brand</header>

      <nav>
        <ul>
          <li><a href="js-demo2.html">Home</a></li>
          <li><a href="js-demo2b.html">About</a></li>
          <li><a href="js-demo2d.html">Gallery</a></li>
          <li><a href="js-demo2c.html">Contact</a></li>
        </ul>
      </nav>

      <main>
        <h1>My Fourth Heading</h1>

        <p>My Fourth paragraph.</p>

        <ul id="album"></ul>
      </main>

      <footer>&copy; Copyright 2020</footer>
    </div>

    <script>
      var photos = [];
      var fileNames = [];
      var imageList = [];

      var image;

      var openList1 = "<li id='photo";
      var openList2 = "'>";
      var closeList = "</li>";

      var openCaptionTag = "<p class='caption'>";
      var closeCaptionTag = "</p>";

      var openDescTag = "<div class='description'>";
      var closeDescTag = "</div>";

      var captionTexts = [
        "Beautiful Winter",
        "Snow Land",
        "Wintery Road",
        "Winter in the Country",
        "Bitter Cold Day",
        "Sunny Winter Day",
        "Snowy Forest",
        "Frozen Landscape",
        "Winter Morning",
        "Peaceful Snowfall",
      ];

      var descTexts = [
        "A beautiful winter scenery in the morning",
        "After an overnight snowstorm",
        "Snowy drive on the road",
        "Snow day in the country",
        "Burrrrr... a typical cold day in January",
        "Cold, snowy but sunny and beautiful",
        "A quiet forest covered with fresh snow",
        "A frozen landscape during the winter season",
        "A peaceful winter morning surrounded by snow",
        "Soft snow falling over the winter landscape",
      ];

      for (var i = 0; i < 10; i++) {
        fileNames.push("winterland" + (i + 1));

        photos.push(
          "<img src='images/" +
            fileNames[i] +
            ".jpg' alt='" +
            captionTexts[i] +
            "'>",
        );

        image =
          openList1 +
          (i + 1) +
          openList2 +
          photos[i] +
          openCaptionTag +
          captionTexts[i] +
          closeCaptionTag +
          openDescTag +
          descTexts[i] +
          closeDescTag +
          closeList;

        imageList.push(image);
      }

      document.getElementById("album").innerHTML = imageList.join("");
    </script>
  </body>
</html>
